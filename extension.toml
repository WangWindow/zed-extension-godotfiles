authors = ["WangWindow <1598593280@qq.com>"]
description = "Zed support for the Godot files."
id = "gdfiles"
name = "Godot Files"
repository = "https://github.com/WangWindow/zed-extension-godotfiles"
schema_version = 1
version = "1.0.0"

[language_servers.gdscript]
name = "Godot GDScript"
languages = ["GDScript"]

[language_servers.gdscript.language_ids]
GDScript = "gdscript"

[language_servers.gdfiles-lsp]
name = "gdfiles-lsp"
languages = ["Godot Resource", "Godot UID", "GDShader"]

[language_servers.gdfiles-lsp.language_ids]
"Godot Resource" = "godot-resource"
"Godot UID" = "godot-uid"
GDShader = "gdshader"

[language_servers.gdshader-lsp]
name = "GDShader LSP"
languages = ["GDShader"]
opt_in_languages = ["GDShader"]

[language_servers.gdshader-lsp.language_ids]
GDShader = "gdshader"

[debug_adapters.godot]
schema_path = "debug_adapter_schemas/godot.json"

[grammars.gdscript]
commit = "872e2e96905892c954da4101c74b884d0155f4d8"
repository = "https://github.com/PrestonKnopp/tree-sitter-gdscript"

[grammars.gdshader]
commit = "68268631c8b6dc093985f1246b099f81b30ea7d1"
repository = "https://github.com/airblast-dev/tree-sitter-gdshader"

[grammars.godot_resource]
commit = "302c1895f54bf74d53a08572f7b26a6614209adc"
repository = "https://github.com/PrestonKnopp/tree-sitter-godot-resource"

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["WangWindow", "zed-extension-godotfiles", "releases", "download", "**"]
